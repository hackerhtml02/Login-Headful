name: SeeDream Token Loop Bot

on:
  workflow_dispatch: # Pehli dafa yahan se manual run karen

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Chrome and Dependencies
        run: |
          pip install selenium requests webdriver-manager

      - name: Run Token Scraper
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python fetch_tokens.py

      - name: 🔁 Auto restart workflow after 1 hr
        env:
          GB_TOKEN: ${{ secrets.GB_TOKEN }}
        run: |
          echo "⏳ Waiting 3600 seconds (1 hr) before restarting..."
          sleep 3600
          echo "🔄 Re-triggering workflow automatically..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/seedream_updater.yml/dispatches \
            -d '{"ref":"main"}'
